# ==============================================================================
# MISE CONFIGURATION
# Context: MacOS M3 (Apple Silicon) | Strategy: Minimalist & Clean
# ==============================================================================

[tools]
ruby = "latest"    # Preferred language for personal scripts
python = "latest"  # Systems automation and audits
uv = "latest"      # Ultra-fast Python package installer and venv manager
usage = "latest"   # Shell completions and CLI spec utility (~15MB)

[settings]
# Core Behavior
legacy_version_file = true      # Support .ruby-version, .python-version
experimental = true             # Unlock advanced features
not_found_auto_install = false  # Explicit behavior: fail if tool is missing

# Performance Optimization (Apple Silicon M3 Pro)
jobs = 8                        # Parallel tasks / compile jobs
always_keep_download = false    # Clean download cache immediately
env_cache = true                # Cache environment calculations for faster cd

# Ecosystem Integrations
python.uv_venv_auto = true      # Auto-create and activate venvs via uv

[settings.self_update]
auto = true
check_duration = "7d"
